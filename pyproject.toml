[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "llamaindex-learning-demo"
version = "0.1.0"
description = "带中文注释的 LlamaIndex 核心功能学习项目"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "llama-index==0.14.23",
  "llama-index-llms-openai>=0.7.0,<0.8.0",
  "llama-index-embeddings-openai>=0.6.0,<0.7.0",
  "llama-index-readers-file>=0.6.0,<0.7.0",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "fastapi>=0.110,<0.120",
  "uvicorn[standard]>=0.27,<0.35",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[project.scripts]
llama-demo = "llamaindex_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
